# Sets up (and later updates) the Moatly network server on Cloudflare – no terminal needed.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions), see docs/EINRICHTUNG.md:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Optional: ADMIN_SECRET (same value as in the moatly-data repo), ADMIN_OAUTH_CLIENT_ID / ADMIN_OAUTH_CLIENT_SECRET (dashboard login).
#
# Creates the D1 database, applies the migrations, creates missing random secrets, deploys the Worker,
# then writes the server address (and the OAuth Client ID, if given) into the app and starts a new app build.

name: Deploy server

on:
  workflow_dispatch:
    inputs:
      oauth_client_id:
        description: 'Client ID of the GitHub OAuth App for the app sign-in (optional, e.g. Ov23li…)'
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/deploy-server.yml']

permissions:
  contents: write # commit the server address into the app config
  actions: write # start the Windows build afterwards

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check Cloudflare secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then exit 0; fi
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "::notice::The server is not set up yet (no Cloudflare secrets), nothing to deploy."
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "::error::Please add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID first (see docs/EINRICHTUNG.md)."
          exit 1

      - uses: actions/checkout@v4
        if: env.SKIP != '1'

      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: env.SKIP != '1'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --prefix server --no-audit --no-fund

      - name: D1 database
        if: env.SKIP != '1'
        run: |
          WRANGLER="$GITHUB_WORKSPACE/server/node_modules/.bin/wrangler"
          TSX="$GITHUB_WORKSPACE/node_modules/.bin/tsx"
          # Run outside the server folder, so wrangler never edits wrangler.toml by itself.
          find_db() { (cd "$RUNNER_TEMP" && "$WRANGLER" d1 list --json) | "$TSX" scripts/deploy-helper.ts d1-id moatly; }
          ID=$(find_db)
          if [ -z "$ID" ]; then
            (cd "$RUNNER_TEMP" && "$WRANGLER" d1 create moatly)
            ID=$(find_db)
          fi
          if [ -z "$ID" ]; then echo "::error::The D1 database could not be created."; exit 1; fi
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" server/wrangler.toml
          cd server && "$WRANGLER" d1 migrations apply moatly --remote

      - name: Deploy Worker
        if: env.SKIP != '1'
        working-directory: server
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          ADMIN_OAUTH_CLIENT_ID: ${{ secrets.ADMIN_OAUTH_CLIENT_ID }}
          ADMIN_OAUTH_CLIENT_SECRET: ${{ secrets.ADMIN_OAUTH_CLIENT_SECRET }}
          # The owner of this repository is the admin of the dashboard.
          ADMIN_GITHUB_ID: ${{ github.repository_owner_id }}
        run: |
          WRANGLER=./node_modules/.bin/wrangler
          TSX="$GITHUB_WORKSPACE/node_modules/.bin/tsx"
          SECRETS="$RUNNER_TEMP/secrets.json"
          # Existing secrets are kept; missing random ones (ADMIN_SECRET, SESSION_SECRET) are created once.
          # Only a Worker that doesn't exist yet counts as "no secrets" – any other error stops here,
          # so a hiccup can never replace existing secrets. (The list contains names only, no values.)
          if LIST=$("$WRANGLER" secret list --format json 2>&1); then
            :
          elif echo "$LIST" | grep -qiE "10007|does not exist|not found"; then
            LIST='[]'
          else
            echo "$LIST"
            echo "::error::Could not read the secrets of the server."
            exit 1
          fi
          printf '%s' "$LIST" | "$TSX" ../scripts/deploy-helper.ts secrets "$SECRETS"
          "$WRANGLER" deploy --secrets-file "$SECRETS" | tee "$RUNNER_TEMP/deploy.log"
          rm -f "$SECRETS"
          URL=$("$TSX" ../scripts/deploy-helper.ts url < "$RUNNER_TEMP/deploy.log")
          if [ -z "$URL" ]; then
            echo "::error::No workers.dev address found. Open Workers & Pages in the Cloudflare dashboard once to choose your workers.dev subdomain, then run this again."
            exit 1
          fi
          echo "SERVER_URL=$URL" >> "$GITHUB_ENV"

      - name: Check that the server answers
        if: env.SKIP != '1'
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$SERVER_URL/" | grep -q Moatly; then echo "Server answers: $SERVER_URL"; exit 0; fi
            sleep 10
          done
          echo "::warning::The server doesn't answer yet. New workers.dev addresses can take a few minutes."

      - name: Connect the app to the server
        if: env.SKIP != '1'
        env:
          CLIENT_ID: ${{ inputs.oauth_client_id }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node_modules/.bin/tsx scripts/deploy-helper.ts config "$SERVER_URL" "$CLIENT_ID"
          git checkout -- server/wrangler.toml
          if git diff --quiet; then
            echo "The app already uses this server."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Connect the app to the Moatly server"
            git push origin "HEAD:$BRANCH"
            # Pushes made by this workflow don't start other workflows, so start the Windows build explicitly.
            gh workflow run build-windows.yml --ref "$BRANCH"
          fi
          {
            echo "## Moatly server is running"
            echo ""
            echo "Address: $SERVER_URL"
            if grep -q "REPLACE_WITH_OAUTH_CLIENT_ID" src/main/config.ts; then
              echo ""
              echo "Still missing: the **Client ID** of the OAuth App. Run this workflow again and paste it into the field."
            else
              echo ""
              echo "The app is connected. The next Windows build (started automatically) shows the **Join** switch."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
