# Kept from the first name (GratisStatt), so a new installer replaces an existing installation.
appId: ch.gratisstatt.app
productName: Moatly
copyright: Moatly
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - '!**/*.map'
asar: true
# better-sqlite3 >= 13 uses Node-API: the same binary works in Node and Electron, no rebuild needed.
npmRebuild: false
asarUnpack:
  - '**/*.node'
extraResources:
  - from: resources/base.db
    to: base.db
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Moatly
  artifactName: ${productName}-Setup-${version}.exe
  # Follows the Windows language (English if it is neither German nor Spanish).
  installerLanguages: [en_US, de_DE, es_ES]
  multiLanguageInstaller: true
portable:
  artifactName: ${productName}-${version}-portable.exe
